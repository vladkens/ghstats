[package]
name = "ghstats"
version = "0.9.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
badgelib = { version = "0.5.0", features = ["axum"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
serde_variant = "0.1.3"
thousands = "0.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-logfmt = { version = "0.3.7", features = ["ansi_logs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints.rust]
dead_code = "allow"

[profile.dev]
debug = 0

[profile.release]
strip = true

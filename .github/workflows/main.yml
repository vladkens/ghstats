name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  build:
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          crates: false
          dev: true
          dev-version: false

  docker:
    if: "github.ref == 'refs/heads/main' || startsWith(github.event.pull_request.title, 'release: v')"
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: commit
        uses: vladkens/actions/release-commit@v1
      - id: check
        if: steps.commit.outputs.release == 'true'
        uses: vladkens/actions/release-check@v1
        with:
          releasers: ${{ github.repository_owner }}

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Extract binaries
        env:
          DIR: ${{ runner.temp }}/release
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf "$DIR/ghstats-dev-x86_64-unknown-linux-musl.tar.gz" -C dist/amd64 ghstats
          tar -xzf "$DIR/ghstats-dev-aarch64-unknown-linux-musl.tar.gz" -C dist/arm64 ghstats

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Docker tags
        id: docker-tags
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          {
            echo "tags<<EOF"
            echo "${image}:main"
            if [ -n "$TAG" ]; then
              echo "${image}:${TAG}"
              echo "${image}:latest"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BIN_SOURCE=prebuilt
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-tags.outputs.tags }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
        with:
          files: false
          crates: false
          dev: false

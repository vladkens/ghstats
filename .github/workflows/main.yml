name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test
      - uses: vladkens/actions/rust-build@v1
        with:
          targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cache: false
          crates: false
          dev: true
          dev-version: false

  docker:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: commit
        uses: vladkens/actions/release-commit@v1
      - id: check
        if: steps.commit.outputs.release == 'true'
        uses: vladkens/actions/release-check@v1
        with:
          releasers: ${{ github.repository_owner }}

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Extract binaries
        env:
          DIR: ${{ runner.temp }}/release
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf "$DIR/ghstats-dev-x86_64-unknown-linux-musl.tar.gz" -C dist/amd64 ghstats
          tar -xzf "$DIR/ghstats-dev-aarch64-unknown-linux-musl.tar.gz" -C dist/arm64 ghstats

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Docker tags
        id: docker-tags
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          {
            echo "tags<<EOF"
            echo "${image}:main"
            if [ -n "$TAG" ]; then
              echo "${image}:${TAG}"
              echo "${image}:latest"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BIN_SOURCE=prebuilt
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Smoke test images
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          old=ghcr.io/vladkens/ghstats:main
          failed=0
          rows=()
          port=18080

          for arch in amd64 arm64; do
            port=$((port + 1))
            echo "::group::build $arch"
            docker buildx build --load --platform "linux/$arch" --build-arg BIN_SOURCE=prebuilt -t "ghstats:$arch" .
            echo "::endgroup::"

            docker run --rm --platform "linux/$arch" --entrypoint /bin/sh "ghstats:$arch" -c 'ls -l /app/ghstats; uname -m'
            docker run -d --platform "linux/$arch" -e GITHUB_TOKEN=dummy -p "$port:8080" --name "gs-$arch" "ghstats:$arch"

            ok=0
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/health"; then
                ok=1
                break
              fi

              sleep 2
            done

            echo
            if [ "$ok" = 1 ]; then
              echo "health ok on $arch"
              body=$(curl -fsS "http://127.0.0.1:$port/" || true)
              echo "${body:0:300}"
              echo
            else
              echo "::error::health check failed on $arch"
              failed=1
            fi

            echo "--- logs gs-$arch"
            docker logs "gs-$arch" 2>&1 | tail -20
            docker rm -f "gs-$arch" >/dev/null

            docker pull --platform "linux/$arch" "$old"
            docker tag "$old" "ghstats-old:$arch"

            new_img=$(docker image inspect -f '{{.Size}}' "ghstats:$arch")
            old_img=$(docker image inspect -f '{{.Size}}' "ghstats-old:$arch")
            new_bin=$(docker run --rm --platform "linux/$arch" --entrypoint stat "ghstats:$arch" -c %s /app/ghstats)
            old_bin=$(docker run --rm --platform "linux/$arch" --entrypoint stat "ghstats-old:$arch" -c %s /app/ghstats)
            rows+=("$arch $ok $new_img $old_img $new_bin $old_bin")
          done

          echo
          printf '%-6s %-7s %14s %14s %14s %14s\n' arch health new_image old_image new_binary old_binary
          for row in "${rows[@]}"; do
            read -r a h ni oi nb ob <<< "$row"
            printf '%-6s %-7s %14s %14s %14s %14s\n' "$a" "$h" "$ni" "$oi" "$nb" "$ob"
          done

          exit "$failed"

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
        with:
          files: false
          crates: false
          dev: false
